name: Build & Deploy to Beget

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Beget via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: kurbanyk.beget.tech
          username: kurbanyk
          key: ${{ secrets.BEGET_SSH_KEY }}
          port: 22
          source: dist/*
          target: /home/kurbanyk/turizm-nao.ru/public_html/
          strip_components: 1
          rm: true
